name: animeflvtv
description: Cliente Android / Android TV para explorar y reproducir anime.
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  html: ^0.15.4                   # parser HTML (equivalente a cheerio/BeautifulSoup)
  video_player: ^2.9.2            # ExoPlayer/Media3 en Android: HLS, MP4, aceleración HW
  # shortcut: beta porque 6.1.5 no compila con AGP 9 (ProGuard); pasar a 6.2.0 estable cuando salga.
  flutter_inappwebview: 6.2.0-beta.3  # WebView headless para hosts que generan el enlace con JS
  wakelock_plus: ^1.2.8           # mantener pantalla encendida durante la reproducción

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
