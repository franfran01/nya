# Al subir un tag vX.Y.Z compila los APK y los publica en GitHub Releases.
name: Release APK

on:
  push:
    tags: ['v*']

permissions:
  contents: write # crear el release y subir los APK

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release --split-per-abi

      - name: Renombrar APKs
        working-directory: build/app/outputs/flutter-apk
        run: |
          for abi in armeabi-v7a arm64-v8a x86_64; do
            mv "app-$abi-release.apk" "nya-${GITHUB_REF_NAME}-$abi.apk"
          done

      - uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/nya-*.apk
          generate_release_notes: true
